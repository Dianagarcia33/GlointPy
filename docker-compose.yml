version: "3.8"

services:
  frontend:
    build:
      context: ./frontend
      args:
        # Permitimos inyectar si estamos en mantenimiento o no
        - VITE_MAINTENANCE_MODE=${MAINTENANCE_MODE:-false}
        - VITE_API_URL=${VITE_API_URL}
    ports:
      # Exponemos en el puerto que el servidor VPS decida (3000 prod, 3001 staging)
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped
    networks:
      - gloint_network

  backend:
    build: 
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - ./backend/.env
    environment:
      # Cuenta de servicio de Firebase (avisos push). El archivo vive solo en el servidor, nunca en git.
      - FIREBASE_CREDENTIALS_PATH=/app/secrets/firebase-service-account.json
    volumes:
      - uploads_data:/app/uploads
      - ./backend/secrets:/app/secrets:ro
    restart: unless-stopped

    networks:
      - gloint_network

volumes:
  uploads_data:

networks:
  gloint_network:
    driver: bridge
