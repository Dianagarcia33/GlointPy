server {
    listen 80;
    client_max_body_size 50M;
    root /usr/share/nginx/html;
    index index.html index.htm;
    server_tokens off;

    # Cabeceras de seguridad (H-147). Se repiten en cada location porque nginx no hereda add_header
    # en un bloque que define los suyos.
    #  - HSTS: los navegadores solo la respetan si la página llegó por HTTPS (el proxy del VPS)
    #  - La CSP va en modo "Report-Only": no bloquea nada, solo avisa en la consola del navegador de
    #    lo que se bloquearía. Cuando QA confirme que no hay avisos, cambiar el nombre de la cabecera a
    #    "Content-Security-Policy" para aplicarla.
    set $hsts "max-age=15552000; includeSubDomains";
    set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src 'self' blob: https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
    set $permissions "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()";

    # 1. Assets estáticos compilados con hash único (se pueden cachear)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 2. version.json e index.html NUNCA deben guardarse en caché
    location ~* ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
        add_header Content-Security-Policy-Report-Only $csp always;
    }

    # 3. Archivos con extensión que no existen (p. ej. /sitemap.xml, /wp-login.php) -> 404 real,
    #    en lugar de devolver el index.html de la SPA con 200
    location ~* \.[a-z0-9]{2,5}$ {
        add_header Strict-Transport-Security $hsts always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # 4. Resto de rutas de la SPA
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Strict-Transport-Security $hsts always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy $permissions always;
        add_header Content-Security-Policy-Report-Only $csp always;
        try_files $uri $uri/ /index.html;
    }
}
